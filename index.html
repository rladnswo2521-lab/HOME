<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가계부</title>

<!-- 아이폰 홈 화면 추가(PWA) 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper: #EFEFF1;
    --card: #FFFFFF;
    --card2: #FFFFFF;
    --ink: #222226;
    --ink-soft: #8E8E93;
    --line: #E4E4E8;
    --income: #3B7DD8;
    --expense: #E2685C;
    --saving: #8574C9;
    --stamp: #8574C9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action: manipulation;}
  body{
    margin:0;
    background: var(--paper);
    font-family: 'Jua', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink);
    padding: calc(16px + env(safe-area-inset-top)) 10px calc(90px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .num{ font-variant-numeric: tabular-nums; }
  .app{
    max-width: 480px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(31,42,56,0.15);
    overflow: hidden;
    border: 1px solid var(--line);
    min-height: 70vh;
    position: relative;
    padding-bottom: 64px;
  }
  .cover{
    background: var(--card);
    color: var(--ink);
    padding: 18px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  .cover h1{ font-weight:800; font-size:20px; margin:0; letter-spacing:-0.3px; }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; }
  .month-nav button{ background:var(--paper); border:none; color:var(--ink); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; }
  .month-nav button:hover{ background:var(--line); }
  .month-nav .label{ font-size:15px; font-weight:600; font-variant-numeric: tabular-nums; }

  .summary2{ display:flex; justify-content:space-between; align-items:flex-start; padding: 16px 20px 4px; }
  .s2-left .s2-line{ font-size:13px; color:var(--ink-soft); margin-bottom:3px; }
  .s2-left .s2-line span{ font-weight:700; font-variant-numeric: tabular-nums; margin-left:4px; }
  .s2-left .s2-line.income span{ color:var(--income); }
  .s2-left .s2-line.expense span{ color:var(--expense); }
  .s2-left .s2-line.saving span{ color:var(--saving); }
  .s2-right{ text-align:right; }
  .s2-right-label{ font-size:11px; color:var(--ink-soft); margin-bottom:2px; }
  .s2-right-val{ font-size:17px; font-weight:800; font-variant-numeric: tabular-nums; }
  .s2-right-val.income{ color:var(--income); }
  .s2-right-val.expense{ color:var(--expense); }

  .gauge-wrap{ padding: 14px 20px 6px; }
  .gauge-track{ height:10px; border-radius:6px; background:#E7E7EA; overflow:hidden; }
  .gauge-fill{ height:100%; border-radius:6px; transition: width .4s ease; }
  .gauge-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-top:6px; }

  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding: 6px 20px 4px; }
  .summary .cell{ background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; }
  .summary .cell .lbl{ font-size:10px; color:var(--ink-soft); margin-bottom:3px; }
  .summary .cell .val{ font-size:13px; font-weight:700; font-variant-numeric: tabular-nums; }
  .summary .cell.income .val{ color:var(--income); }
  .summary .cell.expense .val{ color:var(--expense); }
  .summary .cell.saving .val{ color:var(--saving); }

  .leftover{
    margin: 10px 20px 4px; padding: 10px 12px; border:1px dashed var(--line); border-radius:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; background:#F5F5F7; position:relative;
  }
  .leftover .txt{ font-size:12px; line-height:1.4; }
  .leftover .amt{ font-weight:700; color:var(--saving); font-variant-numeric: tabular-nums; }
  .leftover button{ background:var(--saving); color:#fff; border:none; border-radius:6px; padding:8px 10px; font-size:11px; cursor:pointer; white-space:nowrap; }
  .leftover button:disabled{ background:#9aa6ac; }
  .stamp{
    position:absolute; right:10px; top:-10px; border:3px solid var(--stamp); color:var(--stamp);
    border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; text-align:center; transform:rotate(-14deg); background:rgba(178,58,47,0.06); line-height:1.05;
  }

  .section-title{ font-size:12px; color:var(--ink-soft); margin: 16px 20px 6px; letter-spacing:1px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding: 0 20px; }
  .tile{
    background: var(--card2); border:1px solid var(--line); border-radius:12px;
    padding: 10px 4px 8px; text-align:center; cursor:pointer; user-select:none;
  }
  .tile:active{ transform: scale(0.95); }
  .tile.pressing{ background: #FBEAEA; border-color: var(--expense); transition: background .2s, border-color .2s; }
  .tile .name{ font-size:10.5px; margin-top:4px; color:var(--ink); line-height:1.2; }
  .tile.add-tile{
    background: transparent; border:1px dashed var(--line) !important; border-top-style:dashed !important;
  }
  .tile.add-tile .name{ color: var(--ink-soft); font-weight:700; }

  .cal-topbar{ display:flex; justify-content:flex-end; padding: 10px 20px 0; }
  .cal-topbar button{
    background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:4px 12px;
    font-size:11px; color:var(--ink-soft); cursor:pointer;
  }
  .calendar{ margin: 8px 20px 4px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-grid.cal-header{ margin-bottom:4px; }
  .cal-wd{ font-size:10px; text-align:center; color:var(--ink-soft); padding:2px 0; }
  .cal-cell{
    aspect-ratio: 1 / 1.15; border-radius:8px; padding:3px 1px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; overflow:hidden;
  }
  .cal-cell.empty{ cursor:default; }
  .cal-cell.today{ background:#E9E9EC; }
  .cal-cell.selected{ background:var(--ink); }
  .cal-cell .daynum{ font-size:11px; font-weight:600; color:var(--ink); }
  .cal-cell.selected .daynum{ color:var(--paper); }
  .cal-amt{ font-size:8px; line-height:1.3; font-variant-numeric:tabular-nums; margin-top:1px; }
  .cal-amt.income{ color:var(--income); }
  .cal-amt.expense{ color:var(--expense); }
  .cal-cell.selected .cal-amt.income{ color:#AFCBEF; }
  .cal-cell.selected .cal-amt.expense{ color:#F0B4AC; }

  .tabbar{
    position:absolute; bottom:0; left:0; right:0; height:56px;
    display:flex; background:var(--card2); border-top:1px solid var(--line);
  }
  .tabbar button{
    flex:1; border:none; background:none; cursor:pointer; font-size:11px; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .tabbar button.active{ color:var(--ink); font-weight:700; }

  .tabpanel{ display:none; padding-bottom: 10px; }
  .tabpanel.active{ display:block; }

  .list{ margin: 4px 20px 10px; }
  .hist-filterbar{
    display:flex; align-items:center; justify-content:space-between; padding: 16px 20px 4px;
  }
  .hist-filter-label{ font-size:12px; color:var(--ink-soft); }
  .hist-filterbar button{
    background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:5px 14px;
    font-size:12px; color:var(--ink); cursor:pointer; font-weight:600;
  }
  .day-label{ font-size:11px; color:var(--ink-soft); margin:14px 0 6px; letter-spacing:0.5px; }
  .row{
    display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
    background:var(--card2); border-radius:12px; box-shadow:0 1px 3px rgba(31,42,56,0.06);
  }
  .row-icon{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
  }
  .row-icon.income{ background:#E8F0FC; color:var(--income); }
  .row-icon.expense{ background:#FBEAE8; color:var(--expense); }
  .row-icon.saving{ background:#F0ECFB; color:var(--saving); }
  .row-text{ flex:1; min-width:0; }
  .row-text .cat{ font-size:13px; color:var(--ink); font-weight:600; }
  .row-text .sub{ font-size:11px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
  .row .amount{ font-weight:700; font-size:14px; white-space:nowrap; font-variant-numeric: tabular-nums; }
  .row .amount.income{ color:var(--income); }
  .row .amount.expense{ color:var(--expense); }
  .row .amount.saving{ color:var(--saving); }
  .row .del{ background:none; border:none; color:#c7ccbc; cursor:pointer; font-size:13px; padding-left:2px; }
  .row .del:hover{ color:var(--expense); }
  .empty{ text-align:center; color:var(--ink-soft); font-size:12.5px; padding:30px 10px; }

  .bar-row{ margin: 0 20px 12px; }
  .bar-row .top{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
  .bar-row .top .name{ display:flex; gap:6px; align-items:center; }
  .bar-track{ height:8px; border-radius:5px; background:#E7E7EA; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; }

  .stat-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding: 16px 20px 4px; }
  .stat-summary-card{
    background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center;
  }
  .stat-summary-card .lbl{ font-size:10px; color:var(--ink-soft); margin-bottom:4px; }
  .stat-summary-card .val{ font-size:13px; font-weight:800; font-variant-numeric: tabular-nums; margin-bottom:4px; }
  .stat-summary-card .val.expense{ color:var(--expense); }
  .stat-summary-card .val.saving{ color:var(--saving); }

  .stat-delta{ font-size:10px; font-weight:700; }
  .stat-delta.up{ color:var(--expense); }
  .stat-delta.down{ color:var(--income); }
  .stat-delta.flat{ color:var(--ink-soft); font-weight:400; }
  .stat-delta.new{ color:var(--saving); }

  .chart-card{
    margin: 6px 20px 4px; background:var(--card2); border-radius:14px; padding:14px 8px 6px;
    box-shadow:0 1px 4px rgba(31,42,56,0.07);
  }
  .chart-wrap{ display:flex; justify-content:center; }
  .chart-wrap canvas{ max-width:100%; height:auto; }

  .stat-card{
    background:var(--card2); border-radius:12px; margin: 0 20px 10px; padding:10px 12px;
    box-shadow:0 1px 3px rgba(31,42,56,0.06);
  }
  .stat-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .stat-name{ font-weight:600; color:var(--ink); }
  .stat-amt{ font-weight:700; font-variant-numeric: tabular-nums; }
  .stat-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .stat-cum{ font-size:10.5px; color:var(--ink-soft); font-variant-numeric: tabular-nums; }

  .footer{ text-align:center; padding: 8px 0 6px; font-size:10.5px; color:var(--ink-soft); }
  .footer button{ background:none; border:none; text-decoration:underline; color:var(--ink-soft); cursor:pointer; font-size:10.5px; }

  /* Keypad modal */
  .overlay{
    position:fixed; inset:0; background:rgba(31,42,56,0.45); display:flex; align-items:flex-end; justify-content:center;
    z-index: 50;
  }
  .sheet{
    width:100%; max-width:480px; background:var(--card2); border-radius:18px 18px 0 0; padding: 18px 20px 24px;
    animation: slideup .18s ease-out;
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .sheet .head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .sheet .head .name{ font-weight:700; font-size:15px; }
  .sheet .head .type{ margin-left:auto; font-size:11px; padding:3px 8px; border-radius:10px; color:#fff; }
  .sheet .display{
    font-size:28px; text-align:right; padding: 14px 4px; border-bottom:2px solid var(--line); margin-bottom:12px;
    font-variant-numeric: tabular-nums;
  }
  .sheet .memoline{ width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13px; margin-bottom:10px; font-family:inherit; }
  .seg{ display:flex; gap:6px; }
  .seg button{
    flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--line); background:#fff;
    font-size:13px; cursor:pointer; color:var(--ink-soft);
  }
  .seg button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .keys button{
    padding: 14px 0; font-size:18px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .keys button:active{ background:#EFEFF1; }
  .sheet .actions{ display:flex; gap:8px; margin-top:12px; }
  .sheet .actions button{ flex:1; padding:12px; border-radius:8px; border:none; font-size:14px; cursor:pointer; }
  .sheet .actions .cancel{ background:#EDEDF0; color:var(--ink-soft); }
  .sheet .actions .save{ background:var(--ink); color:var(--paper); font-weight:700; }

  .loading{ text-align:center; padding:40px; color:var(--ink-soft); font-size:13px; }

  .login-wrap{ display:flex; align-items:center; justify-content:center; min-height:60vh; padding:20px; }
  .login-card{ width:100%; max-width:300px; text-align:center; }
  .login-card h2{ font-size:26px; margin:0 0 4px; color:var(--ink); }
  .login-card p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .login-card .memoline{ text-align:left; margin-bottom:10px; }
  .remember-row{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);
    margin-bottom:14px; cursor:pointer; user-select:none;
  }
  .remember-row input[type="checkbox"]{ width:14px; height:14px; cursor:pointer; }
  .login-btn{
    width:100%; background:var(--income); color:#fff; border:none; border-radius:10px;
    padding:13px 0; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px;
  }
  .login-btn:active{ opacity:0.85; }
  .login-error{ color:var(--expense); font-size:12px; margin-top:10px; min-height:14px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">불러오는 중…</div>
</div>

<script>
// ============================================================
// Firebase 설정 — Firebase 콘솔(console.firebase.google.com)에서
// 프로젝트 만들고 "웹 앱 추가" 하면 아래 값들을 그대로 복사할 수 있어요.
// 이 6줄만 본인 값으로 바꾸면 됩니다.
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCwUnvP9zOc2thu468mU_l1aLLHNxkSjTA",
  authDomain: "home-a8c48.firebaseapp.com",
  projectId: "home-a8c48",
  storageBucket: "home-a8c48.firebasestorage.app",
  messagingSenderId: "743304386446",
  appId: "1:743304386446:web:033fded8198508f5ebb6df"
};

let db = null;
let docRef = null;
let auth = null;
let firebaseReady = false;

try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  // 두 분이 쓰는 문서 하나만 사용 — household/main
  docRef = db.collection('household').doc('main');
  firebaseReady = true;
}catch(e){
  console.error("Firebase 초기화 실패", e);
}

const BASE_CATS = {
  income: [
    {name:"급여(남편)"},
    {name:"급여(아내)"},
    {name:"기타수입"}
  ],
  expense: [
    {name:"교통비"},
    {name:"통신비"},
    {name:"보험"},
    {name:"공과금"},
    {name:"차량"},
    {name:"OTT/구독"},
    {name:"대출이자"},
    {name:"개인용돈"},
    {name:"생활비"},
    {name:"경조사비"},
    {name:"여행비"}
  ],
  saving: [
    {name:"개인적금"},
    {name:"비상금"},
    {name:"여유적금"}
  ]
};
// 사용자가 "+"로 직접 추가한 카테고리 (Firebase에 저장되어 두 분 모두에게 동기화됨)
let customCats = { income: [], expense: [], saving: [] };

function allCats(type){
  return BASE_CATS[type].map(c=>({...c, custom:false}))
    .concat(customCats[type].map(c=>({...c, custom:true})));
}

const TYPE_LABEL = {income:"수입", expense:"지출", saving:"저축"};
const TYPE_COLOR = {income:"var(--income)", expense:"var(--expense)", saving:"var(--saving)"};

function findCat(name){
  for(const type of Object.keys(BASE_CATS)){
    const found = allCats(type).find(c=>c.name===name);
    if(found) return {...found, type};
  }
  return {type:"expense"};
}

let state = { transactions: [], month: null, tab: "home", selectedDay: null, historyFilter: { mode: 'all', start: null, end: null } };

function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthOf(d){ return d.slice(0,7); }
function fmt(n){ return (n<0?"-":"") + Math.abs(n).toLocaleString() + "원"; }
function monthLabel(ym){ const [y,m]=ym.split("-"); return `${y}년 ${parseInt(m)}월`; }
function shiftMonth(ym, delta){
  let [y,m] = ym.split("-").map(Number);
  m += delta; if(m<1){m=12;y-=1;} if(m>12){m=1;y+=1;}
  return `${y}-${String(m).padStart(2,"0")}`;
}
function lastDayOfMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

async function load(){
  if(!firebaseReady){
    document.getElementById('app').innerHTML = `
      <div class="loading">
        Firebase 설정이 안 되어 있어요.<br><br>
        코드 위쪽 firebaseConfig 값을<br>
        본인의 Firebase 프로젝트 값으로 채워주세요.
      </div>`;
    return;
  }
  auth.onAuthStateChanged((user) => {
    if(user){
      startApp();
    } else {
      renderLogin();
    }
  });
}

function renderLogin(){
  const savedEmail = localStorage.getItem('gagyebu_saved_email') || '';
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h2>가계부</h2>
        <p>로그인하고 계속하세요</p>
        <input type="email" id="loginEmail" class="memoline" placeholder="이메일" autocomplete="username" value="${savedEmail}">
        <input type="password" id="loginPw" class="memoline" placeholder="비밀번호" autocomplete="current-password">
        <label class="remember-row">
          <input type="checkbox" id="rememberEmail" ${savedEmail ? 'checked' : ''}>
          아이디 저장
        </label>
        <button id="loginBtn" class="login-btn">로그인</button>
        <div id="loginError" class="login-error"></div>
      </div>
    </div>
  `;
  const doLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    if(!email || !pw){ errEl.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    try{
      await auth.signInWithEmailAndPassword(email, pw);
      if(document.getElementById('rememberEmail').checked){
        localStorage.setItem('gagyebu_saved_email', email);
      } else {
        localStorage.removeItem('gagyebu_saved_email');
      }
    }catch(e){
      errEl.textContent = '이메일 또는 비밀번호가 올바르지 않아요.';
    }
  };
  document.getElementById('loginBtn').onclick = doLogin;

function logout(){
  auth.signOut();
}

function startApp(){
  state.month = monthOf(todayStr());
  state.selectedDay = todayStr();

  // 실시간 동기화: 상대방이 기록하면 내 화면도 자동으로 갱신됨
  docRef.onSnapshot((snap) => {
    if(snap.exists){
      const data = snap.data();
      state.transactions = data.transactions ? JSON.parse(data.transactions) : [];
      customCats = data.customCategories ? JSON.parse(data.customCategories) : { income: [], expense: [], saving: [] };
    } else {
      state.transactions = [];
      customCats = { income: [], expense: [], saving: [] };
    }
    render();
  }, (err) => {
    console.error("동기화 오류", err);
    document.getElementById('app').innerHTML = `
      <div class="loading">
        데이터를 불러오지 못했어요.<br><br>
        Firestore 보안 규칙(Rules)에서<br>
        읽기/쓰기 권한을 확인해주세요.<br><br>
        (오류: ${escapeHtml(err.message || String(err))})
      </div>`;
  });
}

async function save(){
  if(!firebaseReady) return;
  try{
    await docRef.set({
      transactions: JSON.stringify(state.transactions),
      customCategories: JSON.stringify(customCats)
    });
  }catch(e){
    console.error("저장 실패", e);
    alert("저장에 실패했어요. 인터넷 연결과 Firebase 설정을 확인해주세요.");
  }
}
function addTransaction(tx){ state.transactions.push(tx); save(); render(); }
function deleteTransaction(id){ state.transactions = state.transactions.filter(t=>t.id!==id); save(); render(); }
function addCategory(type, name){
  const trimmed = name.trim();
  if(!trimmed) return false;
  const exists = allCats(type).some(c => c.name === trimmed);
  if(exists) return false;
  customCats[type].push({ name: trimmed });
  save();
  render();
  return true;
}
function removeCategory(type, name){
  customCats[type] = customCats[type].filter(c => c.name !== name);
  save();
  render();
}
function monthTx(){ return state.transactions.filter(t=>monthOf(t.date)===state.month); }

function formatDayLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const wd = ['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  return `${m}월 ${d}일 (${wd})`;
}

function calendarHtml(list){
  const [y,m] = state.month.split('-').map(Number);
  const startWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayFull = todayStr();
  const perDay = {};
  list.forEach(t=>{
    const d = perDay[t.date] || {income:0, expense:0};
    if(t.type === 'income') d.income += t.amount;
    else d.expense += t.amount; // 지출 + 저축
    perDay[t.date] = d;
  });
  let cells = [];
  for(let i=0;i<startWeekday;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${state.month}-${String(day).padStart(2,'0')}`;
    const d = perDay[dateStr];
    const cls = ['cal-cell'];
    if(dateStr === todayFull) cls.push('today');
    if(dateStr === state.selectedDay) cls.push('selected');
    cells.push(`
      <div class="${cls.join(' ')}" data-date="${dateStr}">
        <div class="daynum">${day}</div>
        ${d && d.income>0 ? `<div class="cal-amt income">+${d.income.toLocaleString()}</div>` : ''}
        ${d && d.expense>0 ? `<div class="cal-amt expense">-${d.expense.toLocaleString()}</div>` : ''}
      </div>
    `);
  }
  const weekdayHeader = ['일','월','화','수','목','금','토'].map(w=>`<div class="cal-wd">${w}</div>`).join('');
  return `
    <div class="calendar">
      <div class="cal-grid cal-header">${weekdayHeader}</div>

      <div class="cal-grid">${cells.join('')}</div>
    </div>
  `;
}

function txRowHtml(t){
  const initial = t.category.trim().charAt(0) || "?";
  return `
    <div class="row">
      <div class="row-icon ${t.type}">${initial}</div>
      <div class="row-text">
        <div class="cat">${t.category}</div>
        <div class="sub">${t.memo ? escapeHtml(t.memo) : "&nbsp;"}</div>
      </div>
      <span class="amount ${t.type}">${t.type==='expense'?'-':'+'}${t.amount.toLocaleString()}원</span>
      <button class="del" data-id="${t.id}">✕</button>
    </div>
  `;
}

function dayListHtml(list, dateStr){
  if(!dateStr){
    return `<div class="empty">달력에서 날짜를 탭하면<br>그날의 내역이 여기 나와요.</div>`;
  }
  const dayItems = list.filter(t=>t.date===dateStr);
  const header = `<div class="day-label">${formatDayLabel(dateStr)}</div>`;
  if(dayItems.length === 0){
    return header + `<div class="empty">이 날은 기록이 없어요.</div>`;
  }
  return header + dayItems.map(txRowHtml).join("");
}

      id: uid(),

      type: cat.type,

  const canvas = document.getElementById('trendChart');
  if(!canvas) return;
  if(typeof Chart === 'undefined'){

      className: 'empty',

    }));
    return;
  }
  Chart.defaults.font.family = "'Jua', -apple-system, sans-serif";
  if(trendChartInstance){ trendChartInstance.destroy(); trendChartInstance = null; }
  const months = last6MonthKeys(state.month);
  const labels = months.map(m => `${parseInt(m.split('-')[1])}월`);
  const incomeData = months.map(m => sumsForMonth(m).income);
  const expenseData = months.map(m => sumsForMonth(m).expense);
  const savingData = months.map(m => sumsForMonth(m).saving);
  const shortNum = (v) => v >= 10000 ? Math.round(v/10000).toLocaleString() + '만' : v.toLocaleString();

  trendChartInstance = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,

// root 안의 카테고리 타일에 롱프레스 삭제 + 탭해서 기록 기능을 연결.
// onOpenKeypad: 타일 탭했을 때 호출 (보통 부모 시트를 닫고 키패드를 여는 용도)
function wireTileEvents(root, onOpenKeypad){
  root.querySelectorAll('.tile:not(.add-tile)').forEach(t=>{
    let pressTimer = null;
    let longPressed = false;
    const isCustom = t.dataset.custom === '1';

    const startPress = () => {
      longPressed = false;
      if(!isCustom) return;
      t.classList.add('pressing');
      pressTimer = setTimeout(() => {
        longPressed = true;
        t.classList.remove('pressing');
        confirmDeleteCategory(t.dataset.type, t.dataset.name);
      }, 550);
    };
    const cancelPress = () => {
      clearTimeout(pressTimer);
      t.classList.remove('pressing');
    };

    t.addEventListener('pointerdown', startPress);
    t.addEventListener('pointerup', cancelPress);
    t.addEventListener('pointerleave', cancelPress);
    t.addEventListener('pointercancel', cancelPress);

    t.onclick = () => {
      if(longPressed){ longPressed = false; return; }
      onOpenKeypad({name:t.dataset.name, type:t.dataset.type});
    };
  });
  root.querySelectorAll('.add-tile').forEach(t=>{
    t.onclick = () => openAddCategory(t.dataset.type);
  });
}

function formatHistoryDayLabel(dateStr){
  const [y,mo,d] = dateStr.split('-').map(Number);

  return `${String(mo).padStart(2,'0')}.${String(d).padStart(2,'0')} ${wd}`;
}

function historyHtml(list){
  if(list.length === 0) return `<div class="empty">조건에 맞는 기록이 없어요.</div>`;
  const grouped = {};
  [...list].sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{ (grouped[t.date]=grouped[t.date]||[]).push(t); });
  return Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).map(date => `
    <div class="day-label">${formatHistoryDayLabel(date)}</div>
    ${grouped[date].map(txRowHtml).join("")}
  `).join("");
}

function getHistoryList(){
  const f = state.historyFilter;
  if(f.mode === 'custom' && f.start && f.end){
    return state.transactions.filter(t => t.date >= f.start && t.date <= f.end);
  }
  return state.transactions;
}

function historyFilterLabel(){
  const f = state.historyFilter;
  if(f.mode === 'custom' && f.start && f.end) return `${f.start} ~ ${f.end}`;
  return '전체';
}

function sumsForMonth(ym){
  const t = {income:0, expense:0, saving:0};
  state.transactions.filter(tx=>monthOf(tx.date)===ym).forEach(tx=> t[tx.type]+=tx.amount);
  return t;
}

function last6MonthKeys(endYm){
  let arr = [];
  let cur = endYm;
  for(let i=0;i<6;i++){ arr.unshift(cur); cur = shiftMonth(cur,-1); }
  return arr;
}

function momBadge(cur, prev){
  if(prev === 0){
    if(cur === 0) return `<span class="stat-delta flat">-</span>`;
    return `<span class="stat-delta new">신규</span>`;
  }
  const pct = Math.round(((cur-prev)/prev)*100);
  if(pct === 0) return `<span class="stat-delta flat">변동없음</span>`;
  const up = pct > 0;
  return `<span class="stat-delta ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}

function categoryStats(){
  const prevMonth = shiftMonth(state.month,-1);
  const curByCat = {}, prevByCat = {}, cumByCat = {};
  state.transactions.forEach(t=>{
    if(t.type === 'income') return;
    if(monthOf(t.date) === state.month) curByCat[t.category] = (curByCat[t.category]||0) + t.amount;
    if(monthOf(t.date) === prevMonth) prevByCat[t.category] = (prevByCat[t.category]||0) + t.amount;
    cumByCat[t.category] = (cumByCat[t.category]||0) + t.amount;
  });
  const names = new Set([...Object.keys(curByCat), ...Object.keys(prevByCat)]);
  return [...names].map(name => ({
    name,
    cur: curByCat[name] || 0,
    prev: prevByCat[name] || 0,
    cum: cumByCat[name] || 0,
    type: findCat(name).type
  })).sort((a,b)=>b.cur-a.cur);
}

function statsHtml(list, totals){
  const prevMonth = shiftMonth(state.month,-1);
  const prevTotals = sumsForMonth(prevMonth);
  const cumSaving = state.transactions.filter(t=>t.type==='saving').reduce((s,t)=>s+t.amount,0);
  const cumExpense = state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

  const summaryCards = `
    <div class="stat-summary">
      <div class="stat-summary-card">
        <div class="lbl">이번 달 지출</div>
        <div class="val expense">${fmt(totals.expense)}</div>
        ${momBadge(totals.expense, prevTotals.expense)}
      </div>
      <div class="stat-summary-card">
        <div class="lbl">이번 달 저축</div>
        <div class="val saving">${fmt(totals.saving)}</div>
        ${momBadge(totals.saving, prevTotals.saving)}
      </div>
      <div class="stat-summary-card">
        <div class="lbl">누적 저축</div>
        <div class="val saving">${fmt(cumSaving)}</div>
        <span class="stat-delta flat">전체 기간</span>
      </div>
    </div>
  `;

  const chartSection = `
    <div class="section-title">최근 6개월 추이</div>
    <div class="chart-card">
      <div class="chart-wrap"><canvas id="trendChart" width="340" height="190"></canvas></div>
    </div>
  `;

  const catRows = categoryStats();
  const max = catRows.length ? Math.max(...catRows.map(c=>c.cur), 1) : 1;
  const catSection = catRows.length === 0
    ? `<div class="empty">아직 지출/저축 기록이 없어요.</div>`
    : catRows.map(c=>{
        const pct = Math.round((c.cur/max)*100);
        return `
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-name">${c.name}</span>
              <span class="stat-amt">${fmt(c.cur)}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${TYPE_COLOR[c.type]};"></div></div>
            <div class="stat-bottom">
              ${momBadge(c.cur, c.prev)}
              <span class="stat-cum">누계 ${fmt(c.cum)}</span>
            </div>
          </div>
        `;
      }).join("");

  return `
    ${summaryCards}
    ${chartSection}
    <div class="section-title">항목별 (전월대비 · 누계)</div>
    ${catSection}
  `;
}

function showActiveTab(){
  ['home','write','history','stats'].forEach(t=>{
    const el = document.getElementById('panel-'+t);
    if(el) el.classList.toggle('active', state.tab === t);
  });
}

load();
</script>
